<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>四宮數獨 · Mini Sudoku</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1a2e28;
      --ink-soft: #3d5a50;
      --mist: #e8f2ee;
      --paper: #f7fbf9;
      --teal: #0d9488;
      --teal-deep: #0f766e;
      --coral: #e07a5f;
      --warn: #c45c4a;
      --ok: #2a9d6a;
      --line: rgba(26, 46, 40, 0.14);
      --line-strong: rgba(26, 46, 40, 0.42);
      --shadow: 0 18px 50px rgba(26, 46, 40, 0.12);
      --radius: 18px;
      --cell: min(72px, 18vw);
      --lang-col: 2.75rem;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Manrope", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 55% at 15% 10%, rgba(13, 148, 136, 0.18), transparent 55%),
        radial-gradient(ellipse 70% 50% at 90% 85%, rgba(224, 122, 95, 0.16), transparent 50%),
        linear-gradient(165deg, #d9efe8 0%, var(--mist) 45%, #f0ebe4 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.25rem 0.75rem 2rem;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.35;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.45'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
    }

    .app {
      position: relative;
      width: min(100%, 460px);
      max-width: 100%;
      animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    header {
      text-align: center;
      margin-bottom: 1.15rem;
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
    }

    a.hub-home {
      flex: 0 0 auto;
      width: 2.65rem;
      height: 2.65rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 0.9rem;
      background: #fef3c7;
      border: 2px solid #f59e0b;
      color: #92400e;
      text-decoration: none;
      font-size: 1.35rem;
      line-height: 1;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.12s ease, border-color 0.15s ease, filter 0.15s ease;
    }

    a.hub-home:hover,
    a.hub-home:focus-visible {
      border-color: #d97706;
      filter: brightness(1.04);
      outline: none;
      transform: translateY(-1px);
    }

    a.hub-home:active {
      transform: translateY(0);
    }

    .brand {
      font-family: "Fraunces", serif;
      font-size: clamp(1.85rem, 8vw, 3.2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.05;
      color: var(--ink);
      text-align: left;
      min-width: 0;
    }

    .brand-sub {
      display: block;
      font-size: 0.38em;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--teal-deep);
      margin-top: 0.35rem;
    }

    .tagline {
      margin-top: 0.7rem;
      font-size: clamp(0.82rem, 3.4vw, 0.95rem);
      color: var(--ink-soft);
      line-height: 1.45;
      padding: 0 0.15rem;
    }

    .panel {
      position: relative;
      background: color-mix(in srgb, var(--paper) 88%, white);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.65);
      border-radius: calc(var(--radius) + 6px);
      box-shadow: var(--shadow);
      padding: 1rem 0.85rem 1.15rem;
      overflow: hidden;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .difficulty {
      display: flex;
      gap: 0.35rem;
      background: rgba(26, 46, 40, 0.06);
      padding: 0.25rem;
      border-radius: 999px;
    }

    .difficulty button {
      border: 0;
      background: transparent;
      font: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--ink-soft);
      padding: 0.4rem 0.75rem;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, transform 0.15s;
    }

    .difficulty button.active {
      background: var(--ink);
      color: var(--paper);
    }

    .difficulty button:hover:not(.active) {
      color: var(--ink);
    }

    .status {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--teal-deep);
      min-height: 1.2em;
      transition: color 0.2s;
    }

    .status.error {
      color: var(--warn);
    }

    .status.win {
      color: var(--ok);
    }

    .board-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.45rem;
      margin: 0.25rem 0 1rem;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      container-type: inline-size;
      container-name: boardwrap;
    }

    .lang-switch {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      flex: 0 0 var(--lang-col);
      width: var(--lang-col);
      background: rgba(26, 46, 40, 0.06);
      padding: 0.25rem;
      border-radius: 999px;
    }

    .lang-switch button {
      appearance: none;
      width: 100%;
      aspect-ratio: 1;
      border: 0;
      border-radius: 999px;
      background: transparent;
      font: inherit;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--ink-soft);
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .lang-switch button.active {
      background: var(--ink);
      color: var(--paper);
    }

    .lang-switch button:hover:not(.active) {
      color: var(--ink);
    }

    .board {
      --cell: min(72px, calc((100cqi - var(--lang-col) - 0.45rem) / 4));
      display: grid;
      grid-template-columns: repeat(4, var(--cell));
      grid-template-rows: repeat(4, var(--cell));
      gap: 0;
      flex: 0 0 auto;
      width: calc(var(--cell) * 4);
      max-width: calc(100% - var(--lang-col) - 0.45rem);
      border: 2.5px solid var(--ink);
      border-radius: 12px;
      overflow: hidden;
      background: var(--ink);
      animation: boardIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.12s both;
    }

    @keyframes boardIn {
      from {
        opacity: 0;
        transform: scale(0.96);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .cell {
      position: relative;
      width: var(--cell);
      height: var(--cell);
      border: none;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: var(--paper);
      font-family: "Fraunces", serif;
      font-size: calc(var(--cell) * 0.42);
      font-weight: 700;
      color: var(--ink);
      cursor: pointer;
      transition: background 0.18s, color 0.18s, transform 0.15s;
    }

    .cell[data-col="3"] {
      border-right: none;
    }

    .cell[data-row="3"] {
      border-bottom: none;
    }

    .cell[data-col="1"] {
      border-right: 2.5px solid var(--ink);
    }

    .cell[data-row="1"] {
      border-bottom: 2.5px solid var(--ink);
    }

    .cell:hover:not(.given):not(:disabled) {
      background: #eef8f4;
    }

    .cell.selected {
      background: #c8ebe3;
      transform: scale(1.04);
      z-index: 2;
      outline: 2px solid var(--teal);
      outline-offset: -2px;
    }

    .cell.given {
      color: var(--ink);
      cursor: default;
      background: #edf5f1;
    }

    .cell.conflict {
      color: var(--warn);
      background: #fceeed;
    }

    .cell.conflict.selected {
      background: #f8d9d4;
    }

    .cell.related {
      background: #f0f7f4;
    }

    .cell.same-number:not(.given) {
      color: var(--teal-deep);
    }

    .pad {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.45rem;
      margin-bottom: 0.9rem;
    }

    .pad button {
      appearance: none;
      border: 1.5px solid var(--line);
      background: white;
      border-radius: 12px;
      height: 48px;
      font-family: "Fraunces", serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--ink);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.12s, color 0.15s;
    }

    .pad button:hover {
      border-color: var(--teal);
      background: #eef9f6;
    }

    .pad button:active {
      transform: scale(0.96);
    }

    .pad button.erase {
      font-family: "Manrope", sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--ink-soft);
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 0.45rem;
    }

    .actions button {
      appearance: none;
      border: 0;
      border-radius: 12px;
      height: 46px;
      font: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s, background 0.15s, opacity 0.15s;
    }

    .actions button:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--teal);
      color: white;
    }

    .btn-primary:hover {
      background: var(--teal-deep);
    }

    .btn-ghost {
      background: rgba(26, 46, 40, 0.07);
      color: var(--ink);
    }

    .btn-ghost:hover {
      background: rgba(26, 46, 40, 0.12);
    }

    .btn-accent {
      background: var(--coral);
      color: white;
    }

    .btn-accent:hover {
      filter: brightness(0.95);
    }

    .hint {
      margin-top: 0.85rem;
      text-align: center;
      font-size: 0.78rem;
      color: var(--ink-soft);
    }

    .win-overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(247, 251, 249, 0.82);
      backdrop-filter: blur(4px);
      border-radius: calc(var(--radius) + 6px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s;
      z-index: 5;
    }

    .win-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .win-card {
      text-align: center;
      padding: 1.5rem;
      transform: translateY(10px) scale(0.96);
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .win-overlay.show .win-card {
      transform: none;
    }

    .win-card h2 {
      font-family: "Fraunces", serif;
      font-size: 1.8rem;
      margin-bottom: 0.35rem;
    }

    .win-card p {
      color: var(--ink-soft);
      margin-bottom: 1rem;
      font-size: 0.92rem;
    }

    @media (max-width: 380px) {
      body {
        padding: 0.85rem 0.5rem 1.4rem;
      }

      .panel {
        padding: 0.85rem 0.55rem 1rem;
      }

      .actions {
        grid-template-columns: 1fr;
      }

      .toolbar {
        flex-direction: column;
        align-items: stretch;
      }

      .difficulty {
        justify-content: center;
      }

      .status {
        text-align: center;
      }

      a.hub-home {
        width: 2.35rem;
        height: 2.35rem;
        font-size: 1.15rem;
        border-radius: 0.75rem;
      }

      :root {
        --lang-col: 2.35rem;
      }
    }

    /* Fallback when container queries are unavailable */
    @supports not (width: 1cqi) {
      .board {
        --cell: min(72px, calc((100vw - 7.5rem) / 4));
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="title-row">
        <a class="hub-home" href="../index.html" title="Back to Teaching Games" aria-label="Back to Teaching Games">🧒</a>
        <h1 class="brand"><span id="brand-title">四宮數獨</span><span class="brand-sub" id="brand-sub">Mini Sudoku 4×4</span></h1>
      </div>
      <p class="tagline" id="tagline">在每個 2×2 宮、每列與每欄填入 1–4，不可重複</p>
    </header>

    <div class="panel" id="panel">
      <div class="toolbar">
        <div class="difficulty" id="difficulty" role="group" aria-label="難度">
          <button type="button" data-diff="easy" class="active">簡單</button>
          <button type="button" data-diff="medium">中等</button>
        </div>
        <div class="status" id="status" aria-live="polite">選格開始</div>
      </div>

      <div class="board-wrap">
        <div class="board" id="board" role="grid" aria-label="4×4 數獨棋盤"></div>
        <div class="lang-switch" id="lang-switch" role="group" aria-label="語言">
          <button type="button" data-lang="zh" class="active" aria-pressed="true">中</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>

      <div class="pad" id="pad">
        <button type="button" data-num="1">1</button>
        <button type="button" data-num="2">2</button>
        <button type="button" data-num="3">3</button>
        <button type="button" data-num="4">4</button>
        <button type="button" class="erase" data-num="0" id="btn-erase">清除</button>
      </div>

      <div class="actions">
        <button type="button" class="btn-primary" id="btn-new">新遊戲</button>
        <button type="button" class="btn-ghost" id="btn-check">檢查</button>
        <button type="button" class="btn-accent" id="btn-reset">重設</button>
      </div>

      <p class="hint" id="hint">可用鍵盤 1–4，或 Delete / Backspace 清除所選格子</p>

      <div class="win-overlay" id="win">
        <div class="win-card">
          <h2 id="win-title">過關了</h2>
          <p id="win-body">這盤數獨解開了</p>
          <button type="button" class="btn-primary" id="btn-again" style="padding: 0 1.4rem; height: 44px; border-radius: 12px;">再來一局</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SIZE = 4;
    const BOX = 2;
    // Target clue counts. Digging stops early if removing another clue would leave >1 solution.
    const DIFFICULTY = { easy: 8, medium: 6 };
    const I18N = {
      zh: {
        htmlLang: "zh-Hant",
        title: "四宮數獨 · Mini Sudoku",
        brand: "四宮數獨",
        subtitle: "Mini Sudoku 4×4",
        tagline: "在每個 2×2 宮、每列與每欄填入 1–4，不可重複",
        difficulty: "難度",
        language: "語言",
        easy: "簡單",
        medium: "中等",
        startHint: "選格開始",
        board: "4×4 數獨棋盤",
        erase: "清除",
        newGame: "新遊戲",
        check: "檢查",
        reset: "重設",
        hint: "可用鍵盤 1–4，或 Delete / Backspace 清除所選格子",
        winTitle: "過關了",
        winBody: "這盤數獨解開了",
        playAgain: "再來一局",
        givenLocked: "這格是題目，不能改",
        filled: (n) => `填入 ${n}`,
        cleared: "已清除",
        winStatus: "恭喜過關！",
        newStatus: "新局開始，加油",
        resetStatus: "已重設此局",
        wrong: (n) => `有 ${n} 格填得不對`,
        empty: (n) => `還有 ${n} 格空白`,
        cell: (r, c) => `第 ${r} 列第 ${c} 格`,
      },
      en: {
        htmlLang: "en",
        title: "Mini Sudoku",
        brand: "Mini Sudoku",
        subtitle: "4×4 Puzzle",
        tagline: "Fill each 2×2 box, row, and column with 1–4. No repeats.",
        difficulty: "Difficulty",
        language: "Language",
        easy: "Easy",
        medium: "Medium",
        startHint: "Pick a cell",
        board: "4×4 Sudoku board",
        erase: "Erase",
        newGame: "New",
        check: "Check",
        reset: "Reset",
        hint: "Use keys 1–4, or Delete / Backspace to clear a cell",
        winTitle: "You win",
        winBody: "This puzzle is solved",
        playAgain: "Play again",
        givenLocked: "That cell is a clue",
        filled: (n) => `Entered ${n}`,
        cleared: "Cleared",
        winStatus: "Nice solve!",
        newStatus: "New game — good luck",
        resetStatus: "Board reset",
        wrong: (n) => `${n} cell${n === 1 ? "" : "s"} incorrect`,
        empty: (n) => `${n} empty cell${n === 1 ? "" : "s"} left`,
        cell: (r, c) => `Row ${r}, column ${c}`,
      },
    };

    const boardEl = document.getElementById("board");
    const statusEl = document.getElementById("status");
    const winEl = document.getElementById("win");

    let solution = [];
    let puzzle = [];
    let user = [];
    let selected = 0;
    let difficulty = "easy";
    let won = false;
    let lang = localStorage.getItem("sudoku-lang") === "en" ? "en" : "zh";
    let lastStatus = { key: "startHint", kind: "", args: [] };

    function t(key, ...args) {
      const value = I18N[lang][key];
      return typeof value === "function" ? value(...args) : value;
    }

    function applyLanguage() {
      document.documentElement.lang = I18N[lang].htmlLang;
      document.title = t("title");
      document.getElementById("brand-title").textContent = t("brand");
      document.getElementById("brand-sub").textContent = t("subtitle");
      document.getElementById("tagline").textContent = t("tagline");
      document.getElementById("difficulty").setAttribute("aria-label", t("difficulty"));
      document.getElementById("difficulty").querySelector('[data-diff="easy"]').textContent = t("easy");
      document.getElementById("difficulty").querySelector('[data-diff="medium"]').textContent = t("medium");
      document.getElementById("lang-switch").setAttribute("aria-label", t("language"));
      boardEl.setAttribute("aria-label", t("board"));
      document.getElementById("btn-erase").textContent = t("erase");
      document.getElementById("btn-new").textContent = t("newGame");
      document.getElementById("btn-check").textContent = t("check");
      document.getElementById("btn-reset").textContent = t("reset");
      document.getElementById("hint").textContent = t("hint");
      document.getElementById("win-title").textContent = t("winTitle");
      document.getElementById("win-body").textContent = t("winBody");
      document.getElementById("btn-again").textContent = t("playAgain");

      document.querySelectorAll("#lang-switch button").forEach((btn) => {
        const active = btn.dataset.lang === lang;
        btn.classList.toggle("active", active);
        btn.setAttribute("aria-pressed", active ? "true" : "false");
      });

      setStatusKey(lastStatus.key, lastStatus.kind, ...lastStatus.args);
      if (boardEl.children.length) render();
    }

    function setLanguage(next) {
      if (next !== "zh" && next !== "en") return;
      lang = next;
      localStorage.setItem("sudoku-lang", lang);
      applyLanguage();
    }

    function idx(r, c) {
      return r * SIZE + c;
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function isValid(grid, row, col, num) {
      for (let i = 0; i < SIZE; i++) {
        if (grid[idx(row, i)] === num || grid[idx(i, col)] === num) return false;
      }
      const br = Math.floor(row / BOX) * BOX;
      const bc = Math.floor(col / BOX) * BOX;
      for (let r = br; r < br + BOX; r++) {
        for (let c = bc; c < bc + BOX; c++) {
          if (grid[idx(r, c)] === num) return false;
        }
      }
      return true;
    }

    function solve(grid) {
      for (let i = 0; i < SIZE * SIZE; i++) {
        if (grid[i] === 0) {
          const r = Math.floor(i / SIZE);
          const c = i % SIZE;
          for (const num of shuffle([1, 2, 3, 4])) {
            if (isValid(grid, r, c, num)) {
              grid[i] = num;
              if (solve(grid)) return true;
              grid[i] = 0;
            }
          }
          return false;
        }
      }
      return true;
    }

    /** Count solutions up to `limit` (usually 2) so we can detect uniqueness quickly. */
    function countSolutions(grid, limit = 2) {
      const g = grid.slice();
      let count = 0;

      function dfs() {
        if (count >= limit) return;
        let empty = -1;
        for (let i = 0; i < g.length; i++) {
          if (g[i] === 0) {
            empty = i;
            break;
          }
        }
        if (empty === -1) {
          count++;
          return;
        }
        const r = Math.floor(empty / SIZE);
        const c = empty % SIZE;
        for (let num = 1; num <= SIZE; num++) {
          if (!isValid(g, r, c, num)) continue;
          g[empty] = num;
          dfs();
          g[empty] = 0;
          if (count >= limit) return;
        }
      }

      dfs();
      return count;
    }

    function generateSolution() {
      const grid = Array(SIZE * SIZE).fill(0);
      solve(grid);
      return grid;
    }

    /**
     * Dig clues from a full solution, only keeping removals that leave exactly one solution.
     * Stops when we reach `targetClues` or no more safe removals remain.
     */
    function makePuzzle(sol, targetClues) {
      const p = sol.slice();
      const positions = shuffle([...Array(SIZE * SIZE).keys()]);
      for (const pos of positions) {
        const cluesLeft = p.reduce((n, v) => n + (v !== 0 ? 1 : 0), 0);
        if (cluesLeft <= targetClues) break;
        if (p[pos] === 0) continue;
        const saved = p[pos];
        p[pos] = 0;
        if (countSolutions(p, 2) !== 1) {
          p[pos] = saved;
        }
      }
      return p;
    }

    function conflictsAt(grid, pos) {
      const num = grid[pos];
      if (!num) return false;
      const r = Math.floor(pos / SIZE);
      const c = pos % SIZE;
      for (let i = 0; i < SIZE; i++) {
        if (i !== c && grid[idx(r, i)] === num) return true;
        if (i !== r && grid[idx(i, c)] === num) return true;
      }
      const br = Math.floor(r / BOX) * BOX;
      const bc = Math.floor(c / BOX) * BOX;
      for (let rr = br; rr < br + BOX; rr++) {
        for (let cc = bc; cc < bc + BOX; cc++) {
          const j = idx(rr, cc);
          if (j !== pos && grid[j] === num) return true;
        }
      }
      return false;
    }

    function buildBoard() {
      boardEl.innerHTML = "";
      for (let i = 0; i < SIZE * SIZE; i++) {
        const r = Math.floor(i / SIZE);
        const c = i % SIZE;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "cell";
        btn.dataset.index = i;
        btn.dataset.row = r;
        btn.dataset.col = c;
        btn.setAttribute("role", "gridcell");
        btn.addEventListener("click", () => selectCell(i));
        boardEl.appendChild(btn);
      }
      render();
    }

    function selectCell(i) {
      if (won) return;
      selected = i;
      render();
    }

    function setNumber(num) {
      if (won) return;
      if (puzzle[selected] !== 0) {
        setStatusKey("givenLocked", "error");
        return;
      }
      user[selected] = num;
      if (num) setStatusKey("filled", "", num);
      else setStatusKey("cleared");
      render();
      if (isComplete() && !hasAnyConflict()) {
        celebrate();
      }
    }

    function isComplete() {
      return user.every((n) => n !== 0);
    }

    function hasAnyConflict() {
      return user.some((_, i) => conflictsAt(user, i));
    }

    function setStatus(text, kind = "") {
      statusEl.textContent = text;
      statusEl.className = "status" + (kind ? ` ${kind}` : "");
    }

    function setStatusKey(key, kind = "", ...args) {
      lastStatus = { key, kind, args };
      setStatus(t(key, ...args), kind);
    }

    function render() {
      const cells = boardEl.children;
      const selR = Math.floor(selected / SIZE);
      const selC = selected % SIZE;
      const selNum = user[selected];

      for (let i = 0; i < SIZE * SIZE; i++) {
        const cell = cells[i];
        const r = Math.floor(i / SIZE);
        const c = i % SIZE;
        const given = puzzle[i] !== 0;
        const conflict = conflictsAt(user, i);
        const related =
          i !== selected && (r === selR || c === selC || sameBox(r, c, selR, selC));

        cell.textContent = user[i] || "";
        cell.className = "cell";
        if (given) cell.classList.add("given");
        if (i === selected) cell.classList.add("selected");
        if (conflict) cell.classList.add("conflict");
        if (related && !conflict) cell.classList.add("related");
        if (selNum && user[i] === selNum) cell.classList.add("same-number");
        cell.setAttribute("aria-selected", i === selected ? "true" : "false");
        cell.setAttribute("aria-label", t("cell", r + 1, c + 1));
      }
    }

    function sameBox(r1, c1, r2, c2) {
      return (
        Math.floor(r1 / BOX) === Math.floor(r2 / BOX) &&
        Math.floor(c1 / BOX) === Math.floor(c2 / BOX)
      );
    }

    function celebrate() {
      won = true;
      setStatusKey("winStatus", "win");
      winEl.classList.add("show");
    }

    function newGame() {
      won = false;
      winEl.classList.remove("show");
      solution = generateSolution();
      puzzle = makePuzzle(solution, DIFFICULTY[difficulty]);
      user = [...puzzle];
      selected = user.findIndex((n) => n === 0);
      if (selected < 0) selected = 0;
      setStatusKey("newStatus");
      boardEl.style.animation = "none";
      void boardEl.offsetWidth;
      boardEl.style.animation = "";
      render();
    }

    function resetGame() {
      if (won) {
        newGame();
        return;
      }
      user = [...puzzle];
      setStatusKey("resetStatus");
      render();
    }

    function checkGame() {
      if (won) return;
      let empty = 0;
      let wrong = 0;
      for (let i = 0; i < SIZE * SIZE; i++) {
        if (user[i] === 0) empty++;
        else if (user[i] !== solution[i]) wrong++;
      }
      if (empty === 0 && wrong === 0) {
        celebrate();
        return;
      }
      if (wrong > 0) {
        setStatusKey("wrong", "error", wrong);
      } else if (empty > 0) {
        setStatusKey("empty", "", empty);
      }
      render();
    }

    document.querySelectorAll(".difficulty button").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".difficulty button").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        difficulty = btn.dataset.diff;
        newGame();
      });
    });

    document.getElementById("lang-switch").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-lang]");
      if (!btn) return;
      setLanguage(btn.dataset.lang);
    });

    document.getElementById("pad").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-num]");
      if (!btn) return;
      setNumber(Number(btn.dataset.num));
    });

    document.getElementById("btn-new").addEventListener("click", newGame);
    document.getElementById("btn-check").addEventListener("click", checkGame);
    document.getElementById("btn-reset").addEventListener("click", resetGame);
    document.getElementById("btn-again").addEventListener("click", newGame);

    document.addEventListener("keydown", (e) => {
      if (won && e.key !== "Enter") return;

      if (e.key >= "1" && e.key <= "4") {
        setNumber(Number(e.key));
        e.preventDefault();
        return;
      }
      if (e.key === "Backspace" || e.key === "Delete" || e.key === "0") {
        setNumber(0);
        e.preventDefault();
        return;
      }

      const r = Math.floor(selected / SIZE);
      const c = selected % SIZE;
      let nr = r;
      let nc = c;
      if (e.key === "ArrowUp") nr = Math.max(0, r - 1);
      else if (e.key === "ArrowDown") nr = Math.min(SIZE - 1, r + 1);
      else if (e.key === "ArrowLeft") nc = Math.max(0, c - 1);
      else if (e.key === "ArrowRight") nc = Math.min(SIZE - 1, c + 1);
      else return;

      selectCell(idx(nr, nc));
      e.preventDefault();
    });

    applyLanguage();
    buildBoard();
    newGame();
  </script>
</body>
</html>
