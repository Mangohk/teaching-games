<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>P5 Story Ending Workshop: Interactive Shared Writing Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Nunito', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    .heading-font {
      font-family: 'Fredoka', cursive, sans-serif;
    }
    .mono-font {
      font-family: 'Share Tech Mono', monospace;
    }
    .slide-viewport {
      aspect-ratio: 16 / 9;
    }
    @keyframes popIn {
      0% { transform: scale(0.97); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .pop-anim {
      animation: popIn 0.22s cubic-bezier(0.175, 0.885, 0.32, 1.25);
    }
    #drawing-canvas {
      touch-action: none;
    }
    ::-webkit-scrollbar {
      width: 7px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
  
    /* Mobile: allow page/stage scrolling so clipped content can be reached */
    @media (max-width: 639px) {
      html, body {
        overflow: auto !important;
        height: auto;
        min-height: 100%;
      }
      .game-viewport,
      .slide-viewport {
        overflow-y: auto !important;
        -webkit-overflow-scrolling: touch;
      }
    }

  </style>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between p-2 sm:p-4 sm:overflow-hidden select-none">

  <!-- Top Smartboard Navigation Toolbar -->
  <header class="w-full max-w-7xl mx-auto flex items-center justify-between bg-slate-900/90 backdrop-blur-md px-4 py-2.5 rounded-2xl border border-slate-800 shadow-xl z-30 mb-2">
    <div class="flex items-center gap-3">
      <a href="../index.html" class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center text-xl shadow-lg no-underline hover:brightness-110" title="Back to Teaching Games" aria-label="Back to Teaching Games">
        ✍️
      </a>
      <div>
        <h1 class="heading-font text-base sm:text-xl font-extrabold text-white tracking-wide">
          Story Ending Workshop • Interactive Shared Writing
        </h1>
        <p class="text-xs text-indigo-300 font-bold hidden sm:block">Primary 5 Narrative Writing • 4-Step Recipe &amp; 50-Word Target</p>
      </div>
    </div>

    <!-- Smartboard Tools -->
    <div class="flex items-center gap-2 sm:gap-3">
      <!-- Word Counter Quick Badge -->
      <div class="hidden md:flex items-center gap-1.5 bg-slate-950 border border-slate-800 px-3 py-1 rounded-xl">
        <span class="text-xs">🎯 Target:</span>
        <span class="mono-font text-xs font-black text-amber-300">≥ 50 Words</span>
      </div>

      <!-- Smartboard Pen Toggle -->
      <button id="pen-toggle-btn" onclick="togglePen()" title="Toggle Smartboard Drawing Pen (P)" class="px-3 py-1.5 sm:px-4 sm:py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs sm:text-sm font-black border border-slate-700 flex items-center gap-1.5 transition active:scale-95 cursor-pointer">
        <span id="pen-icon">✏️</span>
        <span id="pen-status-text" class="hidden md:inline">Pen Off</span>
      </button>

      <!-- Clear Ink -->
      <button onclick="clearCanvas()" title="Clear Pen Ink (C)" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-rose-900/60 text-slate-300 hover:text-rose-200 text-xs sm:text-sm font-bold border border-slate-700 transition active:scale-95 cursor-pointer hidden sm:flex items-center gap-1">
        🗑️ <span>Clear</span>
      </button>

      <!-- All Slides Drawer -->
      <button onclick="toggleDrawer()" title="View All Workshop Stages" class="px-3 py-1.5 sm:px-4 sm:py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs sm:text-sm font-black shadow-md transition active:scale-95 flex items-center gap-1.5 cursor-pointer">
        📑 <span class="hidden sm:inline">All Stages</span>
      </button>

      <!-- Fullscreen Toggle -->
      <button onclick="toggleFullscreen()" title="Fullscreen Mode (F)" class="p-2 sm:px-3 sm:py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs sm:text-sm font-bold border border-slate-700 transition active:scale-95 cursor-pointer">
        ⛶
      </button>
    </div>
  </header>

  <!-- Main Slide Presentation Stage (16:9 Aspect Ratio) -->

    <div id="presentation-frame" class="slide-viewport w-full max-h-[82vh] bg-white rounded-3xl shadow-2xl border-4 border-slate-800 overflow-hidden relative flex flex-col justify-between p-4 sm:p-6 md:p-8 text-slate-900 transition-all">
      
      <!-- Slide Content Area (Injected via JavaScript) -->
      <div id="active-slide-container" class="w-full h-full relative z-10 flex flex-col justify-between">
      </div>

      <!-- Smartboard Canvas Drawing Overlay -->
      <canvas id="drawing-canvas" class="absolute inset-0 w-full h-full z-20 pointer-events-none"></canvas>
    </div>
  </main>

  <!-- Bottom Navigation Bar -->

    <div class="flex items-center gap-2">
      <span class="text-xs sm:text-sm font-black uppercase text-indigo-300">Stage</span>
      <span id="slide-counter" class="heading-font text-base sm:text-xl font-bold bg-slate-950 px-3 py-0.5 rounded-lg border border-slate-800 text-amber-300">
        1 / 13
      </span>
    </div>

    <div class="flex items-center gap-3">

        <span>◀</span> <span class="hidden sm:inline">Previous</span>

        <span class="hidden sm:inline">Next Stage</span> <span>▶</span>
      </button>
    </div>
  </footer>

    function draw(e) {
      if (!isDrawing || !isPenActive) return;
      const coords = getCoords(e);
      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
      ctx.lineTo(coords.x, coords.y);
      ctx.stroke();
      lastX = coords.x;
      lastY = coords.y;
    }

    function stopDrawing() {
      isDrawing = false;
    }

    window.togglePen = function() {
      isPenActive = !isPenActive;
      if (isPenActive) {
        canvas.classList.remove('pointer-events-none');
        canvas.classList.add('cursor-crosshair');
        penToggleBtn.classList.add('bg-rose-600', 'text-white', 'border-rose-400');
        penToggleBtn.classList.remove('bg-slate-800', 'text-slate-200');
        penStatusText.textContent = 'Pen Active';
        penIcon.textContent = '🖊️';
      } else {
        canvas.classList.add('pointer-events-none');
        canvas.classList.remove('cursor-crosshair');
        penToggleBtn.classList.remove('bg-rose-600', 'text-white', 'border-rose-400');
        penToggleBtn.classList.add('bg-slate-800', 'text-slate-200');
        penStatusText.textContent = 'Pen Off';
        penIcon.textContent = '✏️';
      }
    };

    window.clearCanvas = function() {
      const rect = canvas.getBoundingClientRect();
      ctx.clearRect(0, 0, rect.width, rect.height);
    };

    canvas.addEventListener('pointerdown', startDrawing);
    canvas.addEventListener('pointermove', draw);
    canvas.addEventListener('pointerup', stopDrawing);
    canvas.addEventListener('pointercancel', stopDrawing);

    window.toggleFullscreen = function() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.warn('Fullscreen denied:', err);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    };

    // Keyboard Hotkeys
    window.addEventListener('keydown', (e) => {
      if (e.target.matches('textarea, input')) return;
      if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        prevSlide();
      } else if (e.key.toLowerCase() === 'p') {
        togglePen();
      } else if (e.key.toLowerCase() === 'c') {
        clearCanvas();
      } else if (e.key.toLowerCase() === 'f') {
        toggleFullscreen();
      }
    });

    window.addEventListener('resize', resizeCanvas);

    window.addEventListener('DOMContentLoaded', () => {
      populateDrawer();
      renderCurrentSlide();
      resizeCanvas();
    });
  </script>
</body>
</html>
